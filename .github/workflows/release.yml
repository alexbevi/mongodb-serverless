name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write # commit version bumps, create releases and tags
      pull-requests: write # open the "Version Packages" PR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets reads history to find what changed

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Fails early with a clear message rather than letting changesets reach
      # the registry and report ENEEDAUTH, which reads like a config problem.
      - name: Check the npm token is set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::The NPM_TOKEN secret is empty or unset. Set it with: gh secret set NPM_TOKEN"
            exit 1
          fi

          echo "NPM_TOKEN is set (${#NPM_TOKEN} characters)."

      - name: Open a version PR, or publish if one was merged
        id: changesets
        uses: changesets/action@v1
        with:
          # `pnpm run`, not `pnpm <script>`: `version` is a built-in pnpm
          # command, so the bare form prints version info and never runs the
          # script, leaving an empty branch and no PR to open.
          version: pnpm run version
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Changesets publishes through `pnpm publish` because this is a pnpm
          # workspace, and pnpm has no trusted-publishing support, so a token
          # is required. See RELEASING.md.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report what was published
        if: steps.changesets.outputs.published == 'true'
        run: |
          {
            echo '### Published'
            echo
            echo '${{ steps.changesets.outputs.publishedPackages }}' \
              | node -e "
                const packages = JSON.parse(require('node:fs').readFileSync(0, 'utf8'));
                for (const pkg of packages) console.log(\`- \${pkg.name}@\${pkg.version}\`);
              "
          } >> "$GITHUB_STEP_SUMMARY"
