name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write # commit version bumps, create releases and tags
      pull-requests: write # open the "Version Packages" PR
      id-token: write # exchange for a short-lived npm publish credential

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets reads history to find what changed

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Open a version PR, or publish if one was merged
        id: changesets
        uses: changesets/action@v1
        with:
          # `pnpm run`, not `pnpm <script>`: `version` is a built-in pnpm
          # command, so the bare form prints version info and never runs the
          # script, leaving an empty branch and no PR to open.
          version: pnpm run version
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm credential: pnpm 12 exchanges the OIDC token above for a
          # short-lived one. Each package needs a trusted publisher on
          # npmjs.com pointing at this workflow. See RELEASING.md.

      - name: Report what was published
        if: steps.changesets.outputs.published == 'true'
        run: |
          {
            echo '### Published'
            echo
            echo '${{ steps.changesets.outputs.publishedPackages }}' \
              | node -e "
                const packages = JSON.parse(require('node:fs').readFileSync(0, 'utf8'));
                for (const pkg of packages) console.log(\`- \${pkg.name}@\${pkg.version}\`);
              "
          } >> "$GITHUB_STEP_SUMMARY"
