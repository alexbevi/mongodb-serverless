name: mongodb-latency-benchmark
x-mongo: &mongo
  build:
    context: ../..
    dockerfile: benchmark/docker/mongo.Dockerfile
  cap_add: [NET_ADMIN]
  volumes: [certs:/certs:ro]
  command: [mongod, --replSet, benchmark, --bind_ip_all, --keyFile, /certs/keyfile, --tlsMode, requireTLS, --tlsCertificateKeyFile, /certs/server.pem, --tlsCAFile, /certs/ca.crt, --tlsAllowConnectionsWithoutCertificates]
services:
  certificates:
    build:
      context: ../..
      dockerfile: benchmark/docker/mongo.Dockerfile
    entrypoint: [sh, /scripts/certificates.sh]
    volumes: [certs:/certs, ./certificates.sh:/scripts/certificates.sh:ro]
  mongo-a:
    <<: *mongo
    networks:
      bench: {ipv4_address: 172.30.91.11, aliases: [mongo-a.bench.test]}
  mongo-b:
    <<: *mongo
    networks:
      bench: {ipv4_address: 172.30.91.12, aliases: [mongo-b.bench.test]}
  mongo-c:
    <<: *mongo
    networks:
      bench: {ipv4_address: 172.30.91.13, aliases: [mongo-c.bench.test]}
  dns:
    build:
      context: ../..
      dockerfile: benchmark/docker/mongo.Dockerfile
    entrypoint: [dnsmasq]
    command: [--no-daemon, --conf-file=/etc/benchmark-dns.conf]
    volumes: [./dns.conf:/etc/benchmark-dns.conf:ro]
    networks:
      bench: {ipv4_address: 172.30.91.14}
  client:
    mem_limit: 1024m
    dns: [172.30.91.14]
    build:
      context: ../..
      dockerfile: benchmark/docker/client.Dockerfile
    cap_add: [NET_ADMIN]
    volumes: [certs:/certs:ro]
    networks:
      bench: {ipv4_address: 172.30.91.10}
  localstack:
    image: localstack/localstack:4.14.0
    ports: ["127.0.0.1:4566:4566"]
    environment:
      SERVICES: ssm
      AWS_DEFAULT_REGION: ap-southeast-2
    networks:
      bench: {ipv4_address: 172.30.91.15, aliases: [localstack]}
networks:
  bench:
    ipam:
      config: [{subnet: 172.30.91.0/24}]
volumes:
  certs:
