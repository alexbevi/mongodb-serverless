name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from engines.node, and current.
        node: ['20.19', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Docker is preinstalled on ubuntu runners, so the integration suites
      # start their own replica set rather than skipping.
      - run: pnpm test

      - name: Require 10% benchmark improvement (100 iterations)
        timeout-minutes: 5
        run: |
          python3 -m unittest discover -s benchmark/test -p performance_test.py
          pnpm benchmark --no-monitoring --samples 100 --output "$RUNNER_TEMP/benchmark/samples.json"
          python3 benchmark/performance.py "$RUNNER_TEMP/benchmark/samples.json"

      - name: Upload benchmark measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-node-${{ matrix.node }}
          path: ${{ runner.temp }}/benchmark/samples.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Check the packages are installable
        run: |
          set -euo pipefail
          # publishConfig.access and the dist layout are easy to break without
          # any test noticing, so pack and install for real.
          mkdir -p /tmp/packcheck && cd /tmp/packcheck
          npm init -y > /dev/null
          npm pack "$GITHUB_WORKSPACE/driver" "$GITHUB_WORKSPACE/plugins/local" > /dev/null
          npm install ./*.tgz mongodb@7 > /dev/null
          node -e "
            const assert = require('node:assert');
            Promise.all([
              import('@mongodb-serverless/driver'),
              import('@mongodb-serverless/plugin-local')
            ]).then(([driver, local]) => {
              assert.equal(driver.MongoClient.name, 'ServerlessMongoClient');
              assert.equal(typeof local.LocalPlugin, 'function');
              assert.equal(new local.LocalPlugin().writable, false);
              console.log('packed packages resolve');
            });
          "
