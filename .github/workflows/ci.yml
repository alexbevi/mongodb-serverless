name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # MongoDB 8 rejects newer hosted kernels: SERVER-121912.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # The floor from engines.node, and current.
        node: ['20.19', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Docker is preinstalled on ubuntu runners, so the integration suites
      # start their own replica set rather than skipping.
      - run: pnpm test

      - name: Check the packages are installable
        run: |
          set -euo pipefail
          # publishConfig.access and the dist layout are easy to break without
          # any test noticing, so pack and install for real.
          mkdir -p /tmp/packcheck && cd /tmp/packcheck
          npm init -y > /dev/null
          npm pack "$GITHUB_WORKSPACE/driver" "$GITHUB_WORKSPACE/plugins/local" "$GITHUB_WORKSPACE/plugins/aws-ssm" > /dev/null
          npm install ./*.tgz mongodb@7 > /dev/null
          node -e "
            const assert = require('node:assert');
            Promise.all([
              import('@mongodb-serverless/driver'),
              import('@mongodb-serverless/plugin-local'),
              import('@mongodb-serverless/plugin-aws-ssm')
            ]).then(([driver, local, ssm]) => {
              assert.equal(driver.MongoClient.name, 'ServerlessMongoClient');
              assert.equal(typeof local.LocalPlugin, 'function');
              assert.equal(typeof ssm.SsmPlugin, 'function');
              assert.equal(new ssm.SsmPlugin().writable, true);
              assert.equal(new local.LocalPlugin().writable, true);
              assert.equal(new local.LocalPlugin({ writable: false }).writable, false);
              console.log('packed packages resolve');
            });
          "

  benchmark:
    name: benchmark (Node 24)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check benchmark reports
        run: |
          python3 -m pip install -r benchmark/requirements-report.txt
          python3 -m unittest discover -s benchmark/test -p "*_test.py"

      - name: Require 10% benchmark improvement (100 iterations)
        id: benchmark
        timeout-minutes: 10
        run: |
          pnpm exec vitest run --config vitest.benchmark.config.ts benchmark/test/workflow.test.ts
          pnpm benchmark --no-monitoring --samples 100 --output "$RUNNER_TEMP/benchmark/samples.json"
          python3 benchmark/performance.py "$RUNNER_TEMP/benchmark/samples.json"

      - name: Collect detailed latency diagnostics (100 iterations)
        if: always() && steps.benchmark.outcome != 'skipped'
        timeout-minutes: 10
        run: pnpm benchmark --diagnostics --no-monitoring --samples 100 --output "$RUNNER_TEMP/benchmark/diagnostics/samples.json"

      - name: Render benchmark latency
        if: always() && steps.benchmark.outcome != 'skipped'
        timeout-minutes: 3
        env:
          BENCHMARK_NODE: '24'
        run: |
          if [ -f "$RUNNER_TEMP/benchmark/diagnostics/samples.json" ]; then
            python3 -m pip install -r benchmark/requirements-report.txt
            python3 benchmark/report.py "$RUNNER_TEMP/benchmark/diagnostics/samples.json" --environment local
            mv "$RUNNER_TEMP/benchmark/diagnostics/latency.png" "$RUNNER_TEMP/benchmark/latency-node-$BENCHMARK_NODE.png"
          fi

      - name: Upload benchmark measurements
        id: benchmark-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-node-24
          path: |
            ${{ runner.temp }}/benchmark/samples.json
            ${{ runner.temp }}/benchmark/diagnostics/samples.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload latency diagram
        id: benchmark-image
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/benchmark/latency-node-24.png
          archive: false
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize benchmark
        if: always() && steps.benchmark.outcome != 'skipped'
        env:
          BENCHMARK_RESULT: ${{ runner.temp }}/benchmark/samples.json
          BENCHMARK_NODE: '24'
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
          BENCHMARK_IMAGE_URL: ${{ steps.benchmark-image.outputs.artifact-url }}
          BENCHMARK_RESULT_URL: ${{ steps.benchmark-results.outputs.artifact-url }}
        run: python3 benchmark/ci_summary.py

  plugin-aws-ssm:
    name: plugin-aws-ssm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      localstack:
        image: localstack/localstack:4.14.0
        env:
          SERVICES: ssm,kms
        ports:
          - 4566:4566
        options: >-
          --health-cmd "awslocal ssm describe-parameters"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SSM_ENDPOINT: http://127.0.0.1:4566
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mongodb-serverless/plugin-aws-ssm typecheck
      - name: Test the plugin against emulated SSM and KMS
        run: pnpm --filter @mongodb-serverless/plugin-aws-ssm test:integration
