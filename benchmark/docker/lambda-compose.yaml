services:
  localstack:
    image: localstack/localstack:4.14.0
    ports: ["127.0.0.1:4566:4566"]
    environment:
      SERVICES: ssm,lambda,iam,logs,sts
      AWS_DEFAULT_REGION: ap-southeast-2
      LAMBDA_DOCKER_NETWORK: mongodb-latency-benchmark_bench
      LAMBDA_KEEPALIVE_MS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      bench:
        ipv4_address: 172.30.91.15
