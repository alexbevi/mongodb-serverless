name: npm token health

on:
  schedule:
    # Mondays at 08:00 UTC. npm does not report a token's expiry, so this
    # cannot warn ahead of time; a weekly check finds a dead token before the
    # next release needs it rather than during one.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check the token still authenticates
        id: validity
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${NPM_TOKEN}" ]; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status=$(curl -sS -o /tmp/whoami.json -w '%{http_code}' \
            --retry 3 --retry-connrefused --max-time 30 \
            -H "Authorization: Bearer ${NPM_TOKEN}" \
            https://registry.npmjs.org/-/whoami) || status=000

          case "${status}" in
            200)
              # The username is not a secret, but the token it came from is.
              user=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/whoami.json','utf8')).username ?? 'unknown')")
              echo "state=valid" >> "$GITHUB_OUTPUT"
              echo "username=${user}" >> "$GITHUB_OUTPUT"
              ;;
            401|403)
              echo "state=rejected" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # A registry outage is not a token problem.
              echo "state=unknown" >> "$GITHUB_OUTPUT"
              echo "http=${status}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Summarise
        env:
          STATE: ${{ steps.validity.outputs.state }}
          USERNAME: ${{ steps.validity.outputs.username }}
          HTTP: ${{ steps.validity.outputs.http }}
        run: |
          set -uo pipefail
          {
            echo '## npm token health'
            echo
            case "${STATE}" in
              valid)
                echo "Authenticates as \`${USERNAME}\`."
                echo
                echo 'npm does not expose a token'"'"'s expiry date, so this cannot say how'
                echo 'long it has left. Configure [trusted publishing](https://docs.npmjs.com/trusted-publishers)'
                echo 'to remove the token entirely.'
                ;;
              rejected)
                echo 'Rejected by the registry: expired, revoked, or no longer has access.'
                echo
                echo 'Replace the `NPM_TOKEN` secret, or configure trusted publishing and delete it.'
                ;;
              absent)
                echo '`NPM_TOKEN` is not set, so there is nothing to check.'
                echo
                echo 'That is the expected state once trusted publishing is configured.'
                ;;
              unknown)
                echo "Could not reach the registry (HTTP ${HTTP:-?}). Not a token problem."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      # Fails the scheduled run, which GitHub emails the repository owner
      # about. An annotation alone would reach nobody.
      - name: Fail when the token no longer works
        if: steps.validity.outputs.state == 'rejected'
        run: |
          echo "::error::The npm token was rejected by the registry. Publishing will fail until it is replaced."
          exit 1
